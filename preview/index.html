<!doctype html><html><head><meta charset="utf-8"><title>Carousel Studio FTUE</title>
<!-- Canvas template fonts (the theme font list in App.tsx FONTS). -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=DM+Serif+Display&family=Inter:wght@400;700&family=Libre+Baskerville:wght@400;700&family=Lora:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@400;700;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<!-- Preview host only: stands in for Canva's side panel (square edges, full height, 348px, header above the app iframe), the editor canvas (one blank Instagram portrait page) and the version switch at the top right. The app itself uses no custom CSS. -->
<style>html,body{margin:0;height:100%;overflow:hidden;background:#EDEEF0}body{display:flex}#panel{flex:none;width:348px;height:100vh;background:#fff;border-right:1px solid #E3E4E7;display:flex;flex-direction:column}#header{flex:none}#root{flex:1;min-height:0}#stage{flex:1;min-width:0;display:flex;flex-direction:column}#version{flex:none;align-self:flex-end;width:520px;margin:24px 32px 0 0}#canvas{flex:1;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center}.page{position:relative;width:min(100cqw - 96px,(100cqh - 64px) * 0.8);aspect-ratio:4/5;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.06);overflow:hidden}.page .art{position:absolute;inset:0;opacity:0;transition:opacity .35s ease}.page .art.shown{opacity:1}.page .art svg{display:block;width:100%;height:100%}.page .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}</style>
</head><body><div id="panel"><div id="header"></div><div id="root"></div></div><div id="stage"><div id="version"></div><div id="canvas"></div></div><script type="module" src="/src/main.tsx"></script></body></html>
